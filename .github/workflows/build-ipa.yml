name: Build iOS IPA with KataCR models

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics coremltools

      - name: Download KataCR models
        run: bash Scripts/download_models.sh

      - name: Export models to Core ML
        run: python Scripts/export_coreml.py

      - name: Move exported Core ML models
        run: |
          mkdir -p Resources
          find . -maxdepth 2 -name "*.mlpackage" -exec cp -R {} Resources/ \;
          ls -la Resources

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild -project ClashBot.xcodeproj -scheme ClashBot -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/ClashBot.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export unsigned IPA
        run: |
          mkdir -p build/ipa
          cp -R build/ClashBot.xcarchive/Products/Applications/ClashBot.app build/ipa/Payload
          cd build/ipa
          zip -qry ClashBot.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClashBot-ipa
          path: build/ipa/ClashBot.ipa
