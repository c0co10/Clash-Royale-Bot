name: ClashBot
options:
  bundleIdPrefix: com.c0co10
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ClashBot:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c0co10.clashbot
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  ClashBot:
    build:
      targets:
        ClashBot: all
    run:
      config: Debug
    archive:
      config: Release
